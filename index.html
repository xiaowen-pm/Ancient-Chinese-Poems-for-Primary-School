<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>必背诗笺 · 小学生必背古诗词</title>
    <meta name="description" content="小学生必背古诗词 75 + 80 首。横排、拼音、画卷和朗读，免费读。眼下先开放四首，《江南》可以跟读。" />
    <meta name="theme-color" content="#efe8da" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
  </head>
  <body>
    <a class="skip" href="#stage">跳到这一首</a>
    <header>
      <button class="logo" id="home" type="button">
        <span class="seal">诗</span>
        <span>
          <b>必背诗笺</b>
          <small>75 + 80 首小学生必背古诗词 · 免费精读</small>
        </span>
      </button>
      <div class="srch" id="srch">
        <button class="ico" id="sico" type="button" aria-label="搜索">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.25" fill="none" stroke="currentColor" stroke-width="1.8" />
            <path d="M15.2 15.2 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>
        <label class="sr-only" for="q">搜索诗名、作者、诗句或拼音</label>
        <input id="q" type="search" placeholder="搜诗名、作者、诗句，或拼音 jiangnan / jn" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="dd" aria-autocomplete="list" />
        <kbd aria-hidden="true">/</kbd>
        <div class="dd" id="dd" role="listbox"></div>
      </div>
      <button class="print" id="print-open" type="button">
        <span class="print-long">定制打印 · 打卡单</span>
        <span class="print-short">打卡单</span>
      </button>
    </header>

    <main>
      <section class="stage" id="stage">
        <div class="scene" id="scene">
          <img id="scene-img" alt="" />
          <canvas id="fx" aria-hidden="true"></canvas>
          <div id="hots"></div>
          <button class="quiet-exit" id="quiet-exit" type="button">返回伴读</button>
          <div class="player" id="player">
            <button class="pbtn" id="play" type="button" aria-label="播放" aria-pressed="false">▶</button>
            <div class="tname" id="tname"></div>
            <div class="bar" id="seek" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="朗读进度">
              <div id="pr"></div>
            </div>
            <div class="mode" id="mode"></div>
          </div>
        </div>
        <div class="paper" id="paper">
          <div class="tag" id="tag"></div>
          <h1 id="title"></h1>
          <div class="author" id="author"></div>
          <button class="toggle" id="py-toggle" type="button">隐藏拼音自测</button>
          <div class="lines" id="lines"></div>
          <div class="tabs" id="tabs" role="tablist"></div>
          <div class="panel" id="panel" role="tabpanel"></div>
          <button class="pdfbtn" id="pdf-open" type="button">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M7 3.5h7l4 4V20a1.5 1.5 0 0 1-1.5 1.5h-9.5A1.5 1.5 0 0 1 5.5 20V5A1.5 1.5 0 0 1 7 3.5Z" fill="none" stroke="currentColor" stroke-width="1.6" />
              <path d="M14 3.8V8h4.2" fill="none" stroke="currentColor" stroke-width="1.6" />
            </svg>
            免费领取打印版 PDF
          </button>
          <div class="stamp" id="stamp">已背诵<br />诗小仙</div>
        </div>
      </section>

      <section class="gallery" aria-labelledby="gallery-title">
        <h2 id="gallery-title">诗画长廊</h2>
        <p id="gallery-lead"></p>
        <div class="cards" id="cards"></div>
      </section>

      <section class="soon" aria-labelledby="soon-title">
        <h2 id="soon-title">先能搜到的诗</h2>
        <p id="soon-lead"></p>
        <div id="soon-root"></div>
      </section>
    </main>

    <footer class="site">
      <p>必背诗笺免费给小学生和家长读。这一版只有朗读，没有视频。</p>
      <p id="sources"></p>
    </footer>

    <div class="modal" id="modal">
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div>
    </div>
    <noscript>请打开 JavaScript。搜索、翻页和朗读都要它才能用。</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
